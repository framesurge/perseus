[package]
name = "perseus-membership"
version = "0.1.0"
edition = "2021"
description = "Perseus Membership System with User Registration and Authentication"

[dependencies]
perseus = { path = "../../../../packages/perseus" }
sycamore = "0.9.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Server dependencies (non-WASM only)
[target.'cfg(engine)'.dependencies]
perseus-axum = { path = "../../../../packages/perseus-axum" }
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
hyper = "1"
serde_urlencoded = "0.7"
tower = "0.5"

# PostgreSQL with deadpool
deadpool-postgres = { version = "0.14", features = ["serde"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
postgres-types = "0.2"

# Casbin RBAC
casbin = "2"

# HTTP types
http = "1.0"

# Configuration
dotenv = "0.15"
config = "0.14"

# Logging
log = "0.4"
env_logger = "0.11"

# Password hashing
argon2 = "0.5"
bcrypt = "0.16"
rand_core = { version = "0.6", features = ["std"] }

# Encryption
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

# Unicode normalization for passwords
unicode-normalization = "0.1"

# Email sending (for mailpit)
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls-tls"] }

# Time and date
chrono = { version = "0.4", features = ["serde"] }

# Async utilities
futures = "0.3"

# Error handling
anyhow = "1"
thiserror = "2"

# HTTP client (for external API calls if needed)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Session/Cookie handling
axum-extra = { version = "0.10", features = ["cookie"] }
tower-sessions = "0.13"

# File upload handling
multer = "3"
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"

# Client dependencies (WASM only)
[target.'cfg(client)'.dependencies]
gloo-net = { version = "0.5", features = ["json"] }
gloo-storage = "0.3"
wasm-bindgen = "0.2"
sycawysgy = { path = "/home/afidegnum/Projects/WorkShop/Sycamore/sycawysgy" }

[dependencies.web-sys]
features = [
    "HtmlInputElement",
    "Event",
    "EventTarget",
    "Window",
    "Storage",
    # WYSIWYG editor features
    "Document",
    "HtmlElement",
    "HtmlDivElement",
    "Selection",
    "Range",
    "Node",
    "Element",
    "DomRect",
    "File",
    "FileList",
    "FileReader",
    "Blob",
    "FormData",
    "Headers",
    "Request",
    "RequestInit",
    "Response",
    "HtmlImageElement",
    "ProgressEvent",
    "DragEvent",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "ClipboardEvent",
]
version = "0.3"

[dev-dependencies]
fantoccini = "0.20"
