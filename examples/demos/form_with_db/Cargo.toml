[package]
name = "perseus-form-with-db"
version = "0.1.0"
edition = "2021"

[dependencies]
perseus = { path = "../../../packages/perseus" }
sycamore = "0.9.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Server dependencies (non-WASM only)
[target.'cfg(engine)'.dependencies]
perseus-axum = { path = "../../../packages/perseus-axum" }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
tower-http = { version = "0.6", features = ["cors"] }

# Client dependencies (WASM only)
[target.'cfg(client)'.dependencies]
gloo-net = { version = "0.5", features = ["json"] }
wasm-bindgen = "0.2"

[dependencies.web-sys]
features = ["HtmlInputElement", "Event", "EventTarget"]
version = "0.3"


[dev-dependencies]
fantoccini = "0.20"
