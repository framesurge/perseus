[package]
name = "perseus-integration"
version = "0.5.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
perseus-actix-web = { path = "../perseus-actix-web", features = [
    "dflt-server",
], optional = true }
perseus-warp = { path = "../perseus-warp", features = [
    "dflt-server",
], optional = true }
perseus-axum = { path = "../perseus-axum", features = [
    "dflt-server",
], optional = true }
perseus-rocket = { path = "../perseus-rocket", features = [
    "dflt-server",
], optional = true }

[features]
# Don't enable any integration by default to avoid feature conflicts in workspace builds
# Users should explicitly select one: actix-web, warp, axum, or rocket
default = []

actix-web = ["perseus-actix-web"]
warp = ["perseus-warp"]
axum = ["perseus-axum"]
rocket = ["perseus-rocket"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(engine)'] }
